# CI — runs on every push and pull request.
# lint (ruff, shellcheck, hadolint, actionlint) → unit + integration tests with a real PostgreSQL
# → build the Docker image → smoke-test the image. Nothing here needs secrets or AWS.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "**/screenshots/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:        # lets deploy.yml reuse this pipeline as its first stage

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: 04-cloud-services/app
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (python, shell, dockerfile, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: ruff (lint + format check)
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --quiet -r requirements-dev.txt
          ruff check .
          ruff format --check .

      - name: shellcheck all bash scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          # -x follows `source` so lib/common.sh is checked in context
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR:.

      - name: hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: actionlint (workflow syntax)
        uses: raven-actions/actionlint@v2

  test:
    name: Tests (pytest + PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: cloudops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cloudops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudops -d cloudops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: install
        working-directory: ${{ env.APP_DIR }}
        run: pip install --quiet -r requirements-dev.txt

      - name: unit + integration tests
        working-directory: ${{ env.APP_DIR }}
        env:
          # the service container is published on localhost inside the runner
          TEST_DATABASE_URL: postgresql://cloudops:ci-only-password@localhost:5432/cloudops_test
        run: pytest -v --junitxml=../../pytest-report.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 7

  docker:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image (not pushed; CD does that)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: 05-docker-containerization/Dockerfile
          push: false
          load: true
          tags: cloudops-notes:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image must run as non-root and contain no .env
        run: |
          test "$(docker run --rm cloudops-notes:ci id -u)" = "10001"
          ! docker run --rm cloudops-notes:ci test -e /app/.env

      - name: run the container and hit the health endpoints
        run: |
          docker run -d --name ci-web -p 8000:8000 -e NOTES_STORE=memory cloudops-notes:ci
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health/ready
          curl -fsS -X POST http://localhost:8000/api/notes -H 'content-type: application/json' \
               -d '{"title":"ci","body":"built from ${{ github.sha }}"}'
          docker logs ci-web
          docker rm -f ci-web

      - name: compose file validates
        working-directory: 05-docker-containerization
        run: |
          cp .env.example .env
          docker compose config --quiet
