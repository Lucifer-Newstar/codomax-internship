# nginx reverse proxy in front of gunicorn (AlmaLinux: /etc/nginx/conf.d/cloudops.conf).
# nginx handles slow clients, static files and (later) TLS; gunicorn only talks to localhost.
upstream cloudops_app {
    server 127.0.0.1:8000 fail_timeout=5s;
}

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log;
    client_max_body_size 64k;

    # Static files straight from disk (faster than going through Python).
    location /static/ {
        alias /opt/cloudops/app/cloudops/static/;
        expires 1h;
    }

    location / {
        proxy_pass http://cloudops_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
