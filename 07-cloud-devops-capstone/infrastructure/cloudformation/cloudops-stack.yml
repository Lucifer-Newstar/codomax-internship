AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudOps capstone — one small EC2 host running the docker compose stack (frontend, api, postgres),
  with a least-privilege instance role, security group, CloudWatch log group and alarms.
  Uses the default VPC so there is nothing else to pay for. Delete the stack to remove everything.

Parameters:
  EnvName:
    Type: String
    Default: prod
    AllowedPattern: "[a-z0-9-]{1,16}"
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small, t4g.micro]
    Description: keep it small; t2/t3.micro are free-tier eligible on new accounts
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AlmaLinux 9 AMI id for the region (infrastructure/scripts/deploy_stack.sh looks it up)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: a public subnet (auto-assign public IP) in VpcId
  AdminCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: "^\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2}$"
    Description: CIDR allowed to SSH (your IP/32). Default blocks SSH entirely — use SSM Session Manager.
  KeyName:
    Type: String
    Default: ""
    Description: optional EC2 key pair name (empty = no SSH key; SSM Session Manager still works)
  ImageApi:
    Type: String
    Default: ghcr.io/lucifer-newstar/cloudops-api:latest
  ImageUi:
    Type: String
    Default: ghcr.io/lucifer-newstar/cloudops-ui:latest
  GitRepo:
    Type: String
    Default: https://github.com/Lucifer-Newstar/codomax-internship.git
  AlarmEmail:
    Type: String
    Default: ""
    Description: optional e-mail for alarm notifications

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  HasEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ---------------- networking ----------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudOps capstone web host - http from anywhere, ssh from AdminCidr only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: http }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: ssh-admin }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0, Description: all-outbound }
      Tags:
        - { Key: Name, Value: !Sub "cloudops-capstone-web-${EnvName}" }
        - { Key: Project, Value: cloudops }

  # ---------------- IAM (least privilege) ----------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cloudops-capstone-ec2-${EnvName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # Session Manager + Run Command
      Policies:
        - PolicyName: cloudops-logs-metrics-params
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ContainerLogsToCloudWatch
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cloudops/*"
              - Sid: CustomMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": CloudOps } }
              - Sid: ReadOwnParameters
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudops/${EnvName}/*"
      Tags:
        - { Key: Project, Value: cloudops }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------- compute ----------------
  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref "AWS::NoValue"]
      MetadataOptions: { HttpTokens: required }        # IMDSv2 only
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 12, VolumeType: gp3, DeleteOnTermination: true, Encrypted: true }
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -euxo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1
          dnf -y install git dnf-plugins-core
          dnf -y install https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm || true
          systemctl enable --now amazon-ssm-agent || true
          git clone --depth 1 ${GitRepo} /opt/codomax-internship
          cd /opt/codomax-internship/07-cloud-devops-capstone/infrastructure/scripts
          IMAGE_API=${ImageApi} IMAGE_UI=${ImageUi} ./bootstrap.sh
          hostnamectl set-hostname cloudops-capstone-${EnvName}
      Tags:
        - { Key: Name, Value: !Sub "cloudops-capstone-${EnvName}" }
        - { Key: Project, Value: cloudops }    # the GitHub deploy role may only target this tag
        - { Key: Env, Value: !Ref EnvName }

  # ---------------- monitoring ----------------
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cloudops/capstone
      RetentionInDays: 7

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasEmail
    Properties:
      TopicName: !Sub "cloudops-capstone-alarms-${EnvName}"
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  Http5xxFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - { MetricName: Http5xx, MetricNamespace: CloudOps, MetricValue: "1", DefaultValue: 0 }

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cloudops-capstone-${EnvName}-http-5xx"
      Namespace: CloudOps
      MetricName: Http5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlarmTopic], []]

  StatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cloudops-capstone-${EnvName}-status-check"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{ Name: InstanceId, Value: !Ref WebInstance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: !If [HasEmail, [!Ref AlarmTopic], []]

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "cloudops-capstone-${EnvName}-cpu-high"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: InstanceId, Value: !Ref WebInstance }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlarmTopic], []]

Outputs:
  InstanceId:
    Value: !Ref WebInstance
    Description: set as GitHub variable EC2_INSTANCE_ID
  PublicIp:
    Value: !GetAtt WebInstance.PublicIp
  AppUrl:
    Value: !Sub "http://${WebInstance.PublicDnsName}"
    Description: set as GitHub variable APP_URL (user-data needs ~4 minutes before it answers)
  SessionManager:
    Value: !Sub "aws ssm start-session --target ${WebInstance}"
