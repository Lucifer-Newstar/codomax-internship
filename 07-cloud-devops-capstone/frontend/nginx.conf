# Frontend container: serves the static UI and proxies API/ops paths to the backend service.
# Being same-origin removes any CORS configuration from the backend.
upstream backend { server backend:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location ~ ^/(api|health|metrics)(/|$) {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
        expires 10m;
    }
}
