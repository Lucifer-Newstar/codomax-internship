# CloudOps Notes — local stack: nginx (edge) -> web (gunicorn) -> db (PostgreSQL)
#
#   cp .env.example .env            # set POSTGRES_PASSWORD etc.
#   docker compose up -d --build
#   open http://localhost:8080
#
# Networks: `edge` is the only one with a published port; `backend` is internal (no host access).
# Volumes: db data lives in the named volume `pgdata`, so `docker compose down` + `up` keeps notes.

name: cloudops

services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # one-off init: runs only when the volume is empty
      - ../04-cloud-services/app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No `ports:` — the database is reachable only from containers on `backend`.

  web:
    build:
      context: ../04-cloud-services/app
      dockerfile: ../../05-docker-containerization/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: cloudops-notes:${IMAGE_TAG:-dev}
    container_name: cloudops-web
    restart: unless-stopped
    env_file: .env                      # APP_*, LOG_* etc. (never committed)
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db                       # service name = DNS name on the compose network
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-cloudops}
      DB_USER: ${POSTGRES_USER:-cloudops}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable               # same host network namespace; RDS uses `require`
    depends_on:
      db:
        condition: service_healthy      # wait for pg_isready, not just "container started"
    networks: [backend, edge]
    expose: ["8000"]                    # visible to nginx only; not published to the host
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  nginx:
    image: nginx:1.27-alpine
    container_name: cloudops-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../04-cloud-services/app/cloudops/static:/usr/share/nginx/html/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  edge:
  backend:
    internal: true                      # containers here get no route to the outside world

volumes:
  pgdata:
